<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – EFM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f13; color: #fff; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 24px; }
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
    .sub { color: #888; font-size: 0.9rem; margin-bottom: 36px; }
    .card { background: #1a1a22; border-radius: 14px; padding: 28px; width: 100%; max-width: 440px; margin-bottom: 24px; }
    input { width: 100%; padding: 12px 14px; font-size: 0.95rem; background: #0f0f13; border: 1.5px solid #333; border-radius: 8px; color: #fff; outline: none; font-family: system-ui,sans-serif; margin-bottom: 12px; }
    input:focus { border-color: #666; }
    button { width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 700; background: #fff; color: #0f0f13; border: none; border-radius: 8px; cursor: pointer; font-family: system-ui,sans-serif; }
    button:hover { background: #ddd; }
    #err { color: #f87171; font-size: 0.9rem; margin-bottom: 10px; min-height: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 10px 12px; color: #888; font-weight: 600; border-bottom: 1px solid #2a2a35; }
    td { padding: 12px; border-bottom: 1px solid #1e1e28; vertical-align: top; }
    tr:hover td { background: #1e1e28; }
    tr.selected td { background: #1a2a1a; }
    tr.selected:hover td { background: #1f3020; }
    #reply-account-btn:hover { background: #348a34 !important; }
    #compose-send-btn:hover { background: #348a34 !important; }
    #compose-close-btn:hover { background: #23232d !important; color: #fff !important; }
    .badge { display: inline-block; background: #2a2a35; border-radius: 6px; padding: 2px 8px; font-size: 0.8rem; color: #aaa; }
    #count { color: #888; font-size: 0.85rem; margin-bottom: 16px; }
    #chat-panel { width: 100%; max-width: 700px; margin-bottom: 24px; display: none; }
    #chat-panel h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; color: #fff; }
    #chat-msgs { background: #1a1a22; border-radius: 14px; padding: 16px; min-height: 120px; max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
    #chat-msgs::-webkit-scrollbar { width: 4px; }
    #chat-msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    .cm-row { display: flex; flex-direction: column; }
    .cm-row.mine { align-items: flex-end; }
    .cm-name { font-size: 0.7rem; color: #666; margin-bottom: 2px; }
    .cm-bubble { max-width: 75%; padding: 8px 13px; border-radius: 14px; font-size: 0.88rem; line-height: 1.4; word-break: break-word; }
    .cm-bubble.theirs { background: #23232d; color: #ddd; border-bottom-left-radius: 4px; }
    .cm-bubble.mine { background: #2a7a2a; color: #fff; border-bottom-right-radius: 4px; }
    .cm-empty { color: #444; font-size: 0.85rem; text-align: center; padding: 20px 0; }
    .cm-reply-btn { width: auto; margin-top: 5px; padding: 3px 10px; font-size: 0.75rem; font-weight: 600; background: transparent; color: #555; border: 1px solid #333; border-radius: 6px; cursor: pointer; font-family: system-ui,sans-serif; transition: background 0.1s, color 0.1s; }
    .cm-reply-btn:hover { background: #23232d; color: #aaa; }
    .cm-row.selected .cm-bubble.theirs { outline: 2px solid #2a7a2a; }
    .cm-row.selected .cm-reply-btn { background: #2a7a2a; color: #fff; border-color: #2a7a2a; }
    #reply-target { font-size: 0.8rem; color: #2a7a2a; min-height: 20px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    #reply-target-clear { background: none; border: none; color: #555; cursor: pointer; font-size: 0.85rem; padding: 0; width: auto; font-family: system-ui,sans-serif; }
    #reply-target-clear:hover { color: #f87171; background: none; }
    #reply-row { display: flex; gap: 8px; }
    #reply-input { flex: 1; padding: 11px 14px; font-size: 0.93rem; background: #1a1a22; border: 1.5px solid #2a2a35; border-radius: 10px; color: #fff; outline: none; font-family: system-ui,sans-serif; }
    #reply-input:focus { border-color: #2a7a2a; }
    #reply-input:disabled { opacity: 0.35; cursor: not-allowed; }
    #reply-btn { width: auto; padding: 11px 20px; background: #2a7a2a; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-family: system-ui,sans-serif; white-space: nowrap; }
    #reply-btn:hover { background: #348a34; }
    #reply-btn:disabled { opacity: 0.35; cursor: not-allowed; background: #2a7a2a; }
  </style>
</head>
<body>
  <h1>EFM Admin</h1>
  <p class="sub">Only accessible to the site owner</p>

  <div class="card" id="login-card">
    <input id="email" type="email" placeholder="Your email">
    <input id="pass" type="password" placeholder="Your password">
    <p id="err"></p>
    <button onclick="load()">View Accounts</button>
  </div>

  <div id="chat-panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><h2 style="margin-bottom:0;">💬 Talk to Elton — incoming messages</h2><button onclick="clearAllMsgs()" style="width:auto;padding:5px 14px;font-size:0.8rem;background:transparent;color:#555;border:1px solid #333;border-radius:7px;font-weight:600;">Clear All</button></div>
    <div id="chat-msgs"><p class="cm-empty">No messages yet.</p></div>
    <div id="reply-target"></div>
    <div id="reply-row">
      <input id="reply-input" type="text" placeholder="Select a message to reply…" disabled>
      <button id="reply-btn" onclick="sendReply()" disabled>Send</button>
    </div>
  </div>

  <div id="results" style="width:100%;max-width:700px;display:none;">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="search" type="text" placeholder="Search by name or email…" style="margin-bottom:0;flex:1;">
      <button onclick="doSearch()" style="width:auto;padding:12px 20px;flex-shrink:0;">Search</button>
    </div>
    <div id="table-section" style="display:none;">
      <p id="count" style="color:#888;font-size:0.85rem;margin-bottom:12px;"></p>
      <div style="overflow-x:auto; background:#1a1a22; border-radius:14px; padding:8px; margin-bottom:12px;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Signed up</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <button id="reply-account-btn" onclick="openCompose()" style="display:none;width:auto;padding:10px 22px;background:#2a7a2a;color:#fff;border:none;border-radius:8px;font-size:0.9rem;font-weight:700;cursor:pointer;margin-bottom:12px;"></button>
      <div id="compose-wrap" style="display:none;">
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="compose-input" type="text" placeholder="Type your message…" style="margin-bottom:0;flex:1;background:#1a1a22;border-color:#2a7a2a;">
          <button id="compose-send-btn" onclick="sendDirect()" style="width:auto;padding:12px 20px;flex-shrink:0;background:#2a7a2a;color:#fff;">Send</button>
          <button id="compose-close-btn" onclick="closeCompose()" style="width:auto;padding:12px 14px;flex-shrink:0;background:transparent;color:#888;border:1px solid #333;">✕</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var WS_URL = (location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host;
    var adminWs = null;
    var selectedReplyName = null;
    var selectedReplyRow = null;
    var allAccounts = [];
    var selectedAccount = null;

    function load() {
      var email = document.getElementById('email').value.trim();
      var pass  = document.getElementById('pass').value;
      document.getElementById('err').textContent = '';
      if (!email || !pass) { document.getElementById('err').textContent = 'Fill in both fields.'; return; }

      var ws = new WebSocket(WS_URL);
      ws.onopen = function() {
        ws.send(JSON.stringify({ type: 'admin_get_accounts', email: email, password: pass }));
      };
      ws.onmessage = function(e) {
        var d = JSON.parse(e.data);
        if (d.type === 'admin_error') {
          document.getElementById('err').textContent = d.message;
          ws.close();
        } else if (d.type === 'admin_accounts') {
          showAccounts(d.accounts);
          adminWs = ws;
          ws.send(JSON.stringify({ type: 'elton_chat_join' }));
        } else if (d.type === 'elton_chat_history') {
          var msgs = d.messages || [];
          if (msgs.length) { document.getElementById('chat-msgs').innerHTML = ''; }
          msgs.forEach(function(m) { appendChatMsg(m.name, m.text); });
        } else if (d.type === 'elton_chat_message') {
          appendChatMsg(d.name, d.text);
        }
      };
    }

    function appendChatMsg(name, text) {
      var box = document.getElementById('chat-msgs');
      var empty = box.querySelector('.cm-empty');
      if (empty) empty.remove();
      var mine = name === 'Elton';
      var row = document.createElement('div');
      row.className = 'cm-row' + (mine ? ' mine' : '');
      var nameEl = document.createElement('div');
      nameEl.className = 'cm-name';
      nameEl.textContent = name;
      var bubble = document.createElement('div');
      bubble.className = 'cm-bubble ' + (mine ? 'mine' : 'theirs');
      bubble.textContent = text;
      row.appendChild(nameEl);
      row.appendChild(bubble);
      if (!mine) {
        var replyBtn = document.createElement('button');
        replyBtn.className = 'cm-reply-btn';
        replyBtn.textContent = 'Reply to ' + name;
        replyBtn.onclick = function() { selectReply(name, row); };
        row.appendChild(replyBtn);
      }
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function selectReply(name, row) {
      if (selectedReplyRow) selectedReplyRow.classList.remove('selected');
      selectedReplyName = name;
      selectedReplyRow = row;
      row.classList.add('selected');
      var target = document.getElementById('reply-target');
      target.innerHTML = 'Replying to <strong>' + esc(name) + '</strong>';
      var clear = document.createElement('button');
      clear.id = 'reply-target-clear';
      clear.textContent = '✕';
      clear.onclick = clearReply;
      target.appendChild(clear);
      var input = document.getElementById('reply-input');
      input.disabled = false;
      input.placeholder = 'Reply to ' + name + '…';
      input.focus();
      document.getElementById('reply-btn').disabled = false;
    }

    function clearReply() {
      if (selectedReplyRow) selectedReplyRow.classList.remove('selected');
      selectedReplyName = null;
      selectedReplyRow = null;
      document.getElementById('reply-target').innerHTML = '';
      var input = document.getElementById('reply-input');
      input.disabled = true;
      input.placeholder = 'Select a message to reply…';
      input.value = '';
      document.getElementById('reply-btn').disabled = true;
    }

    function sendReply() {
      var input = document.getElementById('reply-input');
      var text = input.value.trim();
      if (!text || !selectedReplyName || !adminWs || adminWs.readyState !== 1) return;
      adminWs.send(JSON.stringify({ type: 'elton_reply', text: text, target_name: selectedReplyName }));
      if (selectedReplyRow) selectedReplyRow.remove();
      clearReply();
    }

    function clearAllMsgs() {
      document.getElementById('chat-msgs').innerHTML = '<p class="cm-empty">No messages yet.</p>';
      clearReply();
    }

        function showAccounts(list) {
      allAccounts = list;
      document.getElementById('login-card').style.display = 'none';
      document.getElementById('chat-panel').style.display = 'block';
      document.getElementById('results').style.display = 'block';
      renderAccounts(list);
      document.getElementById('table-section').style.display = 'block';
    }

    function doSearch() {
      var q = document.getElementById('search').value.trim().toLowerCase();
      var filtered = q ? allAccounts.filter(function(u) {
        return (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q);
      }) : allAccounts;
      selectedAccount = null;
      document.getElementById('reply-account-btn').style.display = 'none';
      document.getElementById('compose-wrap').style.display = 'none';
      renderAccounts(filtered);
      document.getElementById('table-section').style.display = 'block';
    }

    function renderAccounts(list) {
      document.getElementById('count').textContent = list.length + ' account' + (list.length === 1 ? '' : 's');
      var tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="color:#555;text-align:center;padding:24px;">No accounts found</td></tr>';
        return;
      }
      list.forEach(function(u, i) {
        var date = u.signed_up ? new Date(u.signed_up).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : '—';
        var tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.innerHTML =
          '<td style="color:#555">' + (i+1) + '</td>' +
          '<td style="font-weight:600">' + esc(u.name || '—') + '</td>' +
          '<td style="color:#a0c4ff">' + esc(u.email) + '</td>' +
          '<td style="color:#888">' + date + '</td>';
        tr.addEventListener('click', function() { selectAccount(u, tr); });
        tbody.appendChild(tr);
      });
    }

    function selectAccount(u, tr) {
      var prev = document.querySelector('#tbody tr.selected');
      if (prev) prev.classList.remove('selected');
      tr.classList.add('selected');
      selectedAccount = u;
      var btn = document.getElementById('reply-account-btn');
      btn.textContent = 'Reply to ' + (u.name || u.email || 'User');
      btn.style.display = '';
      document.getElementById('compose-wrap').style.display = 'none';
    }

    function openCompose() {
      document.getElementById('reply-account-btn').style.display = 'none';
      document.getElementById('compose-wrap').style.display = 'block';
      var inp = document.getElementById('compose-input');
      inp.value = '';
      inp.focus();
    }

    function sendDirect() {
      var inp = document.getElementById('compose-input');
      var text = inp.value.trim();
      if (!text || !selectedAccount || !adminWs || adminWs.readyState !== 1) return;
      adminWs.send(JSON.stringify({ type: 'elton_reply', text: text, target_name: selectedAccount.name }));
      closeCompose();
    }

    function closeCompose() {
      document.getElementById('compose-wrap').style.display = 'none';
      document.getElementById('table-section').style.display = 'none';
      document.getElementById('reply-account-btn').style.display = 'none';
      var prev = document.querySelector('#tbody tr.selected');
      if (prev) prev.classList.remove('selected');
      selectedAccount = null;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var a = document.activeElement;
        if (a === document.getElementById('reply-input')) { sendReply(); }
        else if (a === document.getElementById('search')) { doSearch(); }
        else if (a === document.getElementById('compose-input')) { sendDirect(); }
        else { load(); }
      }
    });
  </script>
</body>
</html>
