<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addition – Elton's Fun Math</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #050e1f; min-height: 100vh; overflow: hidden; }

#landing {
  width: 100vw; height: 100vh;
  background: #050e1f;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(80,140,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,140,255,0.1) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
}
.particles { position: absolute; inset: 0; pointer-events: none; }
.particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; }
@keyframes floatUp {
  0%   { transform: translateY(0) scale(1); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.1; }
  100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
}
#mainWord {
  font-size: clamp(2.8rem, 9vw, 6.5rem);
  font-weight: 900; letter-spacing: 0.12em;
  display: flex; position: relative; z-index: 2;
}
#mainWord span { display: inline-block; opacity: 0; color: #00e5ff; text-shadow: 0 0 20px #00e5ff99, 0 0 50px #00b4ff44; }
#subWord {
  font-size: clamp(1rem, 3vw, 2rem); font-weight: 700;
  color: #ffffff; letter-spacing: 0.15em;
  opacity: 0; transform: scale(0) translateY(20px);
  text-shadow: 0 0 20px rgba(0,180,255,0.8);
  border: 2px solid rgba(0,200,255,0.5);
  padding: 0.3em 1.2em; border-radius: 40px;
  background: rgba(0,180,255,0.1);
  cursor: pointer; position: relative; z-index: 2;
  transition: background 0.2s, box-shadow 0.2s;
}
#subWord:hover { background: rgba(0,180,255,0.2); box-shadow: 0 0 30px rgba(0,180,255,0.4); }
.landing-gap { height: clamp(16px, 3vw, 28px); }
</style>
</head>
<body>

<div id="landing">
  <div class="grid-bg"></div>
  <div class="particles" id="particles"></div>
  <div id="mainWord"></div>
  <div class="landing-gap"></div>
  <div id="subWord">LET'S GET STARTED!</div>
</div>

<script>
const particlesEl = document.getElementById('particles');
const blues = ['#00e5ff','#00b4ff','#4488ff','#7ef5f5','#0099ff'];
for (let i = 0; i < 35; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 2 + Math.random() * 3;
  p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${Math.random()*30}%;background:${blues[Math.floor(Math.random()*blues.length)]};animation-duration:${5+Math.random()*9}s;animation-delay:${Math.random()*8}s;opacity:0`;
  particlesEl.appendChild(p);
}

const mainWord = document.getElementById('mainWord');
const subWord  = document.getElementById('subWord');
const WORD = 'ADDITION';

function buildWord() {
  mainWord.innerHTML = '';
  return [...WORD].map(ch => {
    const s = document.createElement('span');
    s.textContent = ch; s.style.opacity = '0';
    mainWord.appendChild(s);
    return s;
  });
}
function animateIn(spans, cb) {
  spans.forEach((s, i) => {
    const spread = (i - 3.5) * 55;
    s.style.transition = 'none'; s.style.opacity = '0';
    s.style.transform = `translateX(${spread}px) translateY(-80px) rotate(${(i-3.5)*8}deg) scale(0.2)`;
    s.style.filter = 'brightness(3) blur(4px)';
    setTimeout(() => {
      s.style.transition = `opacity 0.5s ease ${i*0.07}s, transform 0.6s cubic-bezier(0.34,1.45,0.64,1) ${i*0.07}s, filter 0.5s ease ${i*0.07}s`;
      s.style.opacity = '1'; s.style.transform = 'none'; s.style.filter = 'none';
    }, 50);
  });
  setTimeout(cb, spans.length * 70 + 650);
}
function shimmer(spans, dur, cb) {
  let f = 0; const total = dur / (1000/60);
  function tick() {
    f++;
    spans.forEach((s, i) => {
      const intensity = 0.7 + 0.3 * Math.sin(f*0.08 + i*0.5);
      s.style.textShadow = `0 0 ${20*intensity}px rgba(0,220,255,${intensity}), 0 0 ${50*intensity}px rgba(0,150,255,${intensity*0.5})`;
    });
    if (f < total) requestAnimationFrame(tick);
    else { spans.forEach(s => { s.style.filter = ''; }); if (cb) cb(); }
  }
  requestAnimationFrame(tick);
}
function animateOut(spans, cb) {
  spans.forEach((s, i) => {
    const angle = (i/spans.length)*360, rad = angle*Math.PI/180;
    s.style.transition = `opacity 0.4s ease ${i*0.04}s, transform 0.4s ease ${i*0.04}s`;
    s.style.opacity = '0';
    s.style.transform = `translate(${Math.cos(rad)*200}px,${Math.sin(rad)*150}px) scale(0) rotate(${angle}deg)`;
  });
  setTimeout(cb, spans.length * 40 + 450);
}
function popIn() {
  subWord.style.transition = 'transform 0.55s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease';
  subWord.style.opacity = '1'; subWord.style.transform = 'scale(1) translateY(0)';
}
function popOut(cb) {
  subWord.style.transition = 'transform 0.3s ease, opacity 0.25s ease';
  subWord.style.opacity = '0'; subWord.style.transform = 'scale(0) translateY(20px)';
  setTimeout(cb, 350);
}
function runLoop() {
  const spans = buildWord();
  animateIn(spans, () => {
    shimmer(spans, 1200, () => {
      popIn();
      setTimeout(() => {
        popOut(() => { animateOut(spans, () => setTimeout(runLoop, 400)); });
      }, 3000);
    });
  });
}
setTimeout(runLoop, 300);
</script>
</body>
</html>
