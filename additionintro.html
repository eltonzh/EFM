<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elton's Fun Math</title>
<style>
/* ── LANDING PAGE ── */
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #050e1f; min-height: 100vh; overflow: hidden; }

#landing {
  width: 100vw; height: 100vh;
  background: #050e1f;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(80,140,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,140,255,0.1) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
}
.particles { position: absolute; inset: 0; pointer-events: none; }
.particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; }
@keyframes floatUp {
  0%   { transform: translateY(0) scale(1); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.1; }
  100% { transform: translateY(-100vh) scale(0.2); opacity: 0; }
}
#mainWord {
  font-size: clamp(2.8rem, 9vw, 6.5rem);
  font-weight: 900; letter-spacing: 0.12em;
  display: flex; position: relative; z-index: 2;
}
#mainWord span { display: inline-block; opacity: 0; color: #00e5ff; text-shadow: 0 0 20px #00e5ff99, 0 0 50px #00b4ff44; }
#subWord {
  font-size: clamp(1rem, 3vw, 2rem); font-weight: 700;
  color: #ffffff; letter-spacing: 0.15em;
  opacity: 0; transform: scale(0) translateY(20px);
  text-shadow: 0 0 20px rgba(0,180,255,0.8);
  border: 2px solid rgba(0,200,255,0.5);
  padding: 0.3em 1.2em; border-radius: 40px;
  background: rgba(0,180,255,0.1);
  cursor: pointer; position: relative; z-index: 2;
  transition: background 0.2s, box-shadow 0.2s;
}
#subWord:hover { background: rgba(0,180,255,0.2); box-shadow: 0 0 30px rgba(0,180,255,0.4); }
.landing-gap { height: clamp(16px, 3vw, 28px); }

/* ── MAIN APP (hidden initially) ── */
#app {
  display: none;
  width: 100vw; height: 100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
}

/* Sidebar */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: 240px;
  background: #0d1f3c;
  display: flex; flex-direction: column;
  z-index: 10;
  box-shadow: inset -4px 0 20px rgba(59,130,246,0.25), inset 0 0 40px rgba(29,78,216,0.15);
  overflow: hidden;
}
.logo {
  padding: 16px;
  border-bottom: 1px solid rgba(59,130,246,0.4);
  flex-shrink: 0;
  background: linear-gradient(135deg, #0d1f3c 0%, #1a2f52 100%);
  box-shadow: 0 2px 12px rgba(59,130,246,0.2);
}
.logo-name { font-size: 15px; font-weight: 600; color: #93c5fd; text-shadow: 0 0 10px rgba(147,197,253,0.6); }
.logo-sub  { font-size: 11px; color: #ff8c00; margin-top: 3px; }
.nav-scroll { overflow-y: auto; flex: 1; padding: 6px 0; }
.nav-scroll::-webkit-scrollbar { width: 4px; }
.nav-scroll::-webkit-scrollbar-track { background: #0d1f3c; }
.nav-scroll::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.5); border-radius: 4px; box-shadow: 0 0 6px rgba(59,130,246,0.5); }
.ch-btn {
  width: 100%; background: none; border: none;
  padding: 8px 16px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; text-align: left; font-family: inherit;
  transition: background 0.15s;
}
.ch-btn:hover { background: rgba(59,130,246,0.12); }
.ch-btn.active { background: rgba(255,140,0,0.12); }
.ch-num {
  width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600;
  background: rgba(29,78,216,0.6); color: #93c5fd;
  box-shadow: 0 0 8px rgba(59,130,246,0.5), inset 0 0 4px rgba(147,197,253,0.2);
  transition: all 0.15s;
}
.ch-btn.active .ch-num { background: #ff8c00; color: #fff; box-shadow: 0 0 8px rgba(255,140,0,0.6); }
.ch-label { font-size: 11px; font-weight: 500; color: #bfdbfe; line-height: 1.3; flex: 1; }
.ch-arrow { font-size: 10px; color: rgba(59,130,246,0.6); transition: transform 0.2s; flex-shrink: 0; }
.ch-btn.open .ch-arrow { transform: rotate(90deg); }
.sec-list { display: none; background: rgba(0,0,0,0.25); border-left: 2px solid rgba(59,130,246,0.2); margin-left: 16px; }
.sec-list.open { display: block; }
.sec-link {
  display: block; padding: 6px 16px 6px 30px;
  font-size: 10px; color: #7db4e8;
  border-left: 2px solid transparent;
  transition: color 0.12s, border-color 0.12s, background 0.12s; cursor: pointer;
}
.sec-link:hover { color: #ff8c00; border-left-color: #ff8c00; background: rgba(255,140,0,0.08); }
.sec-link.active { color: #ff8c00; border-left-color: #ff8c00; }
.sec-num { color: rgba(59,130,246,0.7); margin-right: 6px; font-size: 9px; }

/* Main content area */
.main {
  margin-left: 240px;
  height: 100vh;
  background: #f0fdf4;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.topbar {
  background: #1e3a5f; padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
  border-bottom: 2px solid #ff8c00;
  box-shadow: 0 2px 16px rgba(30,58,95,0.35);
}
.topbar-title { font-size: 14px; color: #bfdbfe; font-weight: 500; }
.topbar-badge {
  font-size: 11px; background: #ff8c00; color: #fff;
  border-radius: 20px; padding: 3px 14px; font-weight: 600;
  box-shadow: 0 0 8px rgba(255,140,0,0.35);
}
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Hero */
.hero {
  background: #1e3a5f; border-radius: 12px; padding: 28px;
  margin-bottom: 20px;
  border: 1px solid rgba(59,130,246,0.3);
  box-shadow: 0 4px 24px rgba(30,58,95,0.25);
}
.hero h1 { font-size: 24px; font-weight: 600; color: #e0f2fe; margin-bottom: 6px; }
.hero p  { font-size: 12px; color: #ff8c00; margin-bottom: 6px; }
.hero-sub { font-size: 11px; color: #7db4e8; line-height: 1.7; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
.stat {
  background: #fff; border: 1px solid #bae6fd;
  border-radius: 10px; padding: 14px 16px;
  border-top: 3px solid #3b82f6;
}
.stat-num { font-size: 22px; font-weight: 600; color: #1e3a5f; }
.stat-label { font-size: 10px; color: #6b7280; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em; }

/* Chapter grid */
.section-label {
  font-size: 11px; font-weight: 600; color: #1e3a5f;
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid #bae6fd;
}
.cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.card {
  background: #fff; border: 1.5px solid #93c5fd;
  border-radius: 10px; padding: 14px; cursor: pointer;
  transition: all 0.15s; border-top: 3px solid #60a5fa;
}
.card:hover { border-color: #ff8c00; border-top-color: #ff8c00; box-shadow: 0 4px 16px rgba(30,58,95,0.12); transform: translateY(-2px); }
.card-num { font-size: 10px; color: #3b82f6; margin-bottom: 4px; font-weight: 600; }
.card-title { font-size: 12px; font-weight: 600; color: #1e3a5f; line-height: 1.3; margin-bottom: 4px; }
.card-count { font-size: 10px; color: #6b7280; }

/* Lesson view */
.lesson-view { display: none; }
.lesson-view.active { display: block; }
.lesson-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #bae6fd; }
.lesson-header h2 { font-size: 18px; font-weight: 600; color: #1e3a5f; margin-bottom: 4px; }
.lesson-header p { font-size: 11px; color: #6b7280; }
.lesson-body {
  background: #fff; border: 1px solid #93c5fd;
  border-left: 4px solid #3b82f6;
  border-radius: 10px; padding: 20px;
  font-size: 13px; color: #374151; line-height: 1.9;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: #1e3a5f; background: #e0f2fe;
  border: 1px solid #bae6fd; border-radius: 8px;
  cursor: pointer; font-family: inherit;
  margin-bottom: 16px; padding: 6px 14px;
  transition: background 0.15s;
}
.back-btn:hover { background: #bae6fd; }

/* Page transition */
#landing.fade-out { animation: fadeOut 0.6s ease forwards; }
@keyframes fadeOut { to { opacity: 0; } }
#app.fade-in { animation: fadeIn 0.6s ease forwards; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<!-- LANDING PAGE -->
<div id="landing">
  <div class="grid-bg"></div>
  <div class="particles" id="particles"></div>
  <div id="mainWord"></div>
  <div class="landing-gap"></div>
  <div id="subWord">LET'S GET STARTED!</div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-name">⚡ Elton's Fun Math</div>
      <div class="logo-sub">When math becomes fun</div>
    </div>
    <div class="nav-scroll" id="navScroll"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">Welcome</div>
      <div class="topbar-badge" id="topbarBadge">15 Chapters</div>
    </div>
    <div class="content">
      <div id="homeView">
        <div class="hero">
          <h1>Welcome to Elton's Fun Math!</h1>
          <p>When math becomes fun</p>
          <div class="hero-sub">Choose a chapter from the left panel to start learning. All lessons are free and designed for beginners.</div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-num">15</div><div class="stat-label">Chapters</div></div>
          <div class="stat"><div class="stat-num">97</div><div class="stat-label">Sections</div></div>
          <div class="stat"><div class="stat-num">Free</div><div class="stat-label">Always</div></div>
        </div>
        <div class="section-label">All Chapters</div>
        <div class="cards" id="chapterCards"></div>
      </div>
      <div class="lesson-view" id="lessonView">
        <button class="back-btn" id="backBtn">← Back to all chapters</button>
        <div class="lesson-header">
          <h2 id="lessonTitle"></h2>
          <p id="lessonSub"></p>
        </div>
        <div class="lesson-body" id="lessonBody"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── PARTICLES ──
const particlesEl = document.getElementById('particles');
const blues = ['#00e5ff','#00b4ff','#4488ff','#7ef5f5','#0099ff'];
for (let i = 0; i < 35; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 2 + Math.random() * 3;
  p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${Math.random()*30}%;background:${blues[Math.floor(Math.random()*blues.length)]};animation-duration:${5+Math.random()*9}s;animation-delay:${Math.random()*8}s;opacity:0`;
  particlesEl.appendChild(p);
}

// ── ADDITION ANIMATION ──
const mainWord = document.getElementById('mainWord');
const subWord  = document.getElementById('subWord');
const WORD = 'ADDITION';

function buildWord() {
  mainWord.innerHTML = '';
  return [...WORD].map(ch => {
    const s = document.createElement('span');
    s.textContent = ch; s.style.opacity = '0';
    mainWord.appendChild(s);
    return s;
  });
}
function animateIn(spans, cb) {
  spans.forEach((s, i) => {
    const spread = (i - 3.5) * 55;
    s.style.transition = 'none'; s.style.opacity = '0';
    s.style.transform = `translateX(${spread}px) translateY(-80px) rotate(${(i-3.5)*8}deg) scale(0.2)`;
    s.style.filter = 'brightness(3) blur(4px)';
    setTimeout(() => {
      s.style.transition = `opacity 0.5s ease ${i*0.07}s, transform 0.6s cubic-bezier(0.34,1.45,0.64,1) ${i*0.07}s, filter 0.5s ease ${i*0.07}s`;
      s.style.opacity = '1'; s.style.transform = 'none'; s.style.filter = 'none';
    }, 50);
  });
  setTimeout(cb, spans.length * 70 + 650);
}
function shimmer(spans, dur, cb) {
  let f = 0; const total = dur / (1000/60);
  function tick() {
    f++;
    spans.forEach((s, i) => {
      const intensity = 0.7 + 0.3 * Math.sin(f*0.08 + i*0.5);
      s.style.textShadow = `0 0 ${20*intensity}px rgba(0,220,255,${intensity}), 0 0 ${50*intensity}px rgba(0,150,255,${intensity*0.5})`;
    });
    if (f < total) requestAnimationFrame(tick);
    else { spans.forEach(s => { s.style.filter = ''; }); if (cb) cb(); }
  }
  requestAnimationFrame(tick);
}
function animateOut(spans, cb) {
  spans.forEach((s, i) => {
    const angle = (i/spans.length)*360, rad = angle*Math.PI/180;
    s.style.transition = `opacity 0.4s ease ${i*0.04}s, transform 0.4s ease ${i*0.04}s`;
    s.style.opacity = '0';
    s.style.transform = `translate(${Math.cos(rad)*200}px,${Math.sin(rad)*150}px) scale(0) rotate(${angle}deg)`;
  });
  setTimeout(cb, spans.length * 40 + 450);
}
function popIn() {
  subWord.style.transition = 'transform 0.55s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease';
  subWord.style.opacity = '1'; subWord.style.transform = 'scale(1) translateY(0)';
}
function popOut(cb) {
  subWord.style.transition = 'transform 0.3s ease, opacity 0.25s ease';
  subWord.style.opacity = '0'; subWord.style.transform = 'scale(0) translateY(20px)';
  setTimeout(cb, 350);
}
function runLoop() {
  const spans = buildWord();
  animateIn(spans, () => {
    shimmer(spans, 1200, () => {
      popIn();
      setTimeout(() => {
        popOut(() => { animateOut(spans, () => setTimeout(runLoop, 400)); });
      }, 3000);
    });
  });
}
setTimeout(runLoop, 300);

// ── TRANSITION TO APP ──
subWord.addEventListener('click', () => {
  document.getElementById('landing').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('landing').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('app').classList.add('fade-in');
  }, 600);
});

// ── APP LOGIC ──
const chapters = [
  { num:1,  title:'Properties of Arithmetic',          secs:['Why Start with Arithmetic?','Addition','Multiplication','Negation','Subtraction','Reciprocals','Division','Summary'] },
  { num:2,  title:'Exponents',                          secs:['Squares','Higher Exponents','Zero as an Exponent','Negative Exponents','Summary'] },
  { num:3,  title:'Number Theory',                      secs:['Multiples','Divisibility Tests','Prime Numbers','Prime Factorization','Least Common Multiple','Divisors','Greatest Common Divisor','Summary'] },
  { num:4,  title:'Fractions',                          secs:['What is a Fraction?','Multiplying Fractions','Dividing by a Fraction','Raising Fractions to Powers','Simplest Form of a Fraction','Comparing Fractions','Adding and Subtracting Fractions','Mixed Numbers','Summary'] },
  { num:5,  title:'Equations and Inequalities',         secs:['Expressions','Solving Linear Equations I','Solving Linear Equations II','Word Problems','Inequalities','Summary'] },
  { num:6,  title:'Decimals',                           secs:['Arithmetic with Decimals','Rounding','Decimals and Fractions','Repeating Decimals','Summary'] },
  { num:7,  title:'Ratios, Conversions, and Rates',     secs:['What is a Ratio?','Multi-way Ratios','Proportions','Conversions','Speed','Other Rates','Summary'] },
  { num:8,  title:'Percents',                           secs:['What is a Percent?','Word Problems','Percent Increase and Decrease','Summary'] },
  { num:9,  title:'Square Roots',                       secs:['From Squares to Square Roots','Square Roots of Non-square Integers','Arithmetic with Square Roots','Summary'] },
  { num:10, title:'Angles',                             secs:['Measuring Angles','Parallel Lines','Angles in Polygons','Summary'] },
  { num:11, title:'Perimeter and Area',                 secs:['Measuring Segments','Area','Circles','Summary'] },
  { num:12, title:'Right Triangles and Quadrilaterals', secs:['The Pythagorean Theorem','Some Special Triangles','Types of Quadrilaterals','Summary'] },
  { num:13, title:'Data and Statistics',                secs:['Basic Statistics','Limits of Basic Statistics','Tables, Graphs, and Charts','Summary'] },
  { num:14, title:'Counting',                           secs:['Counting with Addition and Subtraction','The Multiplication Principle','Casework','Counting Pairs','Probability','Summary'] },
  { num:15, title:'Problem-Solving Strategies',         secs:['Find a Pattern','Make a List','Draw a Picture','Work Backwards'] },
];

const navScroll    = document.getElementById('navScroll');
const chapterCards = document.getElementById('chapterCards');
const homeView     = document.getElementById('homeView');
const lessonView   = document.getElementById('lessonView');
const lessonTitle  = document.getElementById('lessonTitle');
const lessonSub    = document.getElementById('lessonSub');
const lessonBody   = document.getElementById('lessonBody');
const topbarTitle  = document.getElementById('topbarTitle');
const topbarBadge  = document.getElementById('topbarBadge');
const backBtn      = document.getElementById('backBtn');

function showLesson(ch, i) {
  const sec = ch.secs[i];
  lessonTitle.textContent = `${ch.num}.${i+1} — ${sec}`;
  lessonSub.textContent = `Chapter ${ch.num}: ${ch.title}`;
  lessonBody.textContent = `This is where the lesson content for "${sec}" will appear. Students can read explanations, work through examples, and practice problems right here on the EFM website.`;
  topbarTitle.textContent = `Ch.${ch.num} › ${sec}`;
  topbarBadge.textContent = `Chapter ${ch.num}`;
  homeView.style.display = 'none';
  lessonView.classList.add('active');
  document.querySelectorAll('.sec-link').forEach(l => l.classList.remove('active'));
  const t = document.querySelector(`[data-ch="${ch.num}"][data-sec="${i}"]`);
  if (t) t.classList.add('active');
}

backBtn.addEventListener('click', () => {
  homeView.style.display = 'block';
  lessonView.classList.remove('active');
  topbarTitle.textContent = 'Welcome';
  topbarBadge.textContent = '15 Chapters';
  document.querySelectorAll('.sec-link').forEach(l => l.classList.remove('active'));
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
});

chapters.forEach(ch => {
  const btn = document.createElement('button');
  btn.className = 'ch-btn';
  btn.innerHTML = `<span class="ch-num">${ch.num}</span><span class="ch-label">${ch.title}</span><span class="ch-arrow">▶</span>`;
  const list = document.createElement('div');
  list.className = 'sec-list';
  ch.secs.forEach((sec, i) => {
    const a = document.createElement('div');
    a.className = 'sec-link';
    a.dataset.ch = ch.num; a.dataset.sec = i;
    a.innerHTML = `<span class="sec-num">${ch.num}.${i+1}</span>${sec}`;
    a.addEventListener('click', () => {
      document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showLesson(ch, i);
    });
    list.appendChild(a);
  });
  btn.addEventListener('click', () => {
    const isOpen = list.classList.contains('open');
    document.querySelectorAll('.sec-list').forEach(l => l.classList.remove('open'));
    document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('open'));
    if (!isOpen) { list.classList.add('open'); btn.classList.add('open'); }
  });
  navScroll.appendChild(btn);
  navScroll.appendChild(list);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="card-num">Chapter ${ch.num}</div><div class="card-title">${ch.title}</div><div class="card-count">${ch.secs.length} sections</div>`;
  card.addEventListener('click', () => { btn.click(); navScroll.scrollTo({ top: btn.offsetTop - 40, behavior: 'smooth' }); });
  chapterCards.appendChild(card);
});
</script>
</body>
</html>
