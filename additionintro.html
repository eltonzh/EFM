<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Addition – Elton's Fun Math</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #030b18; min-height: 100vh; overflow: hidden; }

#landing {
  width: 100vw; height: 100vh;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

#aurora { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

.grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(80,140,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,140,255,0.06) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none; z-index: 1;
}

#spotlight {
  position: absolute; pointer-events: none; z-index: 2;
  width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,210,255,0.07) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  left: 50%; top: 50%;
  transition: left 0.1s ease, top 0.1s ease;
}

.particles { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.particle {
  position: absolute; border-radius: 50%;
  animation: floatUp linear infinite;
}
.plus-p {
  position: absolute;
  font-weight: 900; line-height: 1;
  animation: floatUp linear infinite;
  color: #00e5ff;
}
@keyframes floatUp {
  0%   { transform: translateY(0); opacity: 0; }
  8%   { opacity: 0.8; }
  90%  { opacity: 0.05; }
  100% { transform: translateY(-100vh); opacity: 0; }
}

#chapterLabel {
  font-size: clamp(0.6rem, 1.4vw, 0.85rem);
  letter-spacing: 0.38em; text-transform: uppercase;
  color: rgba(0, 210, 255, 0.45);
  position: relative; z-index: 5;
  margin-bottom: 4px;
  opacity: 0; transition: opacity 1s ease;
}
#presentsLabel {
  font-size: clamp(0.55rem, 1.2vw, 0.75rem);
  letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(0, 210, 255, 0.28);
  font-style: italic;
  position: relative; z-index: 5;
  margin-bottom: 10px;
  opacity: 0; transition: opacity 1s ease 0.15s;
}

#mainWord {
  font-size: clamp(2.8rem, 9vw, 6.5rem);
  font-weight: 900; letter-spacing: 0.12em;
  display: flex; position: relative; z-index: 5;
  filter: drop-shadow(0 0 28px rgba(0,220,255,0.35));
}
#mainWord span {
  display: inline-block; opacity: 0;
  color: #00e5ff;
  text-shadow: 0 0 20px #00e5ffcc, 0 0 60px #00b4ff66, 0 0 100px #0077ff33;
}

.landing-gap { height: clamp(14px, 2.5vw, 24px); z-index: 5; position: relative; }

@property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes spin { to { --a: 360deg; } }

#subWord {
  font-size: clamp(0.9rem, 2.6vw, 1.75rem); font-weight: 700;
  color: #fff; letter-spacing: 0.15em;
  opacity: 0; transform: scale(0) translateY(20px);
  text-shadow: 0 0 14px rgba(0,180,255,0.9);
  padding: 0.35em 1.5em; border-radius: 40px;
  cursor: pointer; position: relative; z-index: 5;
  border: none; outline: none; background: none;
  transition: box-shadow 0.25s, transform 0.15s;
}
#subWord::before {
  content: '';
  position: absolute; inset: -2px; border-radius: 42px;
  background: conic-gradient(from var(--a), #00e5ff 0%, #0055ff 30%, #7c3aed 55%, #00e5ff 100%);
  animation: spin 2.5s linear infinite;
  z-index: -1;
}
#subWord::after {
  content: '';
  position: absolute; inset: 0; border-radius: 40px;
  background: rgba(3,11,24,0.88);
  z-index: -1;
}
#subWord:hover {
  box-shadow: 0 0 40px rgba(0,180,255,0.45), 0 0 80px rgba(0,80,255,0.2);
  transform: scale(1.05);
}
#subWord:active { transform: scale(0.97); }
</style>
</head>
<body>

<div id="landing">
  <canvas id="aurora"></canvas>
  <div class="grid-bg"></div>
  <div id="spotlight"></div>
  <div class="particles" id="particles"></div>
  <div id="chapterLabel">EFM : Basic Operations</div>
  <div id="presentsLabel">Presents</div>
  <div id="mainWord"></div>
  <div class="landing-gap"></div>
  <div id="subWord">LET'S GET STARTED!</div>
</div>

<script>
// ── AURORA ──
const canvas = document.getElementById('aurora');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

const orbs = [
  { x:0.18, y:0.28, r:0.48, hue:200, s:0.00035, ph:0   },
  { x:0.82, y:0.62, r:0.42, hue:240, s:0.00028, ph:1.8 },
  { x:0.5,  y:0.85, r:0.36, hue:188, s:0.00045, ph:3.1 },
  { x:0.08, y:0.7,  r:0.32, hue:265, s:0.00038, ph:4.7 },
];
let t = 0;
(function drawAurora() {
  t++;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (const o of orbs) {
    const cx = (o.x + Math.sin(t*o.s + o.ph)*0.14) * canvas.width;
    const cy = (o.y + Math.cos(t*o.s*0.75 + o.ph)*0.1) * canvas.height;
    const r  = o.r * Math.max(canvas.width, canvas.height);
    const g  = ctx.createRadialGradient(cx,cy,0, cx,cy,r);
    g.addColorStop(0,   `hsla(${o.hue},100%,60%,0.09)`);
    g.addColorStop(0.45,`hsla(${o.hue},100%,50%,0.04)`);
    g.addColorStop(1,   'transparent');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(drawAurora);
})();

// ── PARTICLES ──
const pel = document.getElementById('particles');
for (let i = 0; i < 55; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  const sz = 2 + Math.random()*3;
  p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;bottom:${Math.random()*65}%;background:#00e5ff;box-shadow:0 0 ${sz*2.5}px #00e5ff;animation-duration:${7+Math.random()*10}s;animation-delay:${Math.random()*10}s;opacity:0`;
  pel.appendChild(p);
}
for (let i = 0; i < 22; i++) {
  const p = document.createElement('div');
  p.className = 'plus-p';
  p.textContent = '+';
  const sz = 12 + Math.random()*16;
  const alpha = 0.25 + Math.random()*0.45;
  p.style.cssText = `font-size:${sz}px;left:${Math.random()*100}%;bottom:${Math.random()*65}%;text-shadow:0 0 ${sz*0.8}px rgba(0,229,255,0.7);opacity:0;animation-duration:${10+Math.random()*12}s;animation-delay:${Math.random()*12}s;`;
  pel.appendChild(p);
}

// ── SPOTLIGHT ──
const spot = document.getElementById('spotlight');
document.addEventListener('mousemove', e => {
  spot.style.left = e.clientX + 'px';
  spot.style.top  = e.clientY + 'px';
});

// ── WORD ANIMATION ──
const mainWord  = document.getElementById('mainWord');
const subWord   = document.getElementById('subWord');
const label     = document.getElementById('chapterLabel');
const presents  = document.getElementById('presentsLabel');
const WORD = 'ADDITION';

function buildWord() {
  mainWord.innerHTML = '';
  return [...WORD].map(ch => {
    const s = document.createElement('span');
    s.textContent = ch; s.style.opacity = '0';
    mainWord.appendChild(s);
    return s;
  });
}
function animateIn(spans, cb) {
  spans.forEach((s, i) => {
    s.style.transition = 'none'; s.style.opacity = '0';
    s.style.transform = `translateX(${(i-3.5)*55}px) translateY(-80px) rotate(${(i-3.5)*8}deg) scale(0.2)`;
    s.style.filter = 'brightness(3) blur(4px)';
    setTimeout(() => {
      s.style.transition = `opacity 0.5s ease ${i*0.07}s, transform 0.6s cubic-bezier(0.34,1.45,0.64,1) ${i*0.07}s, filter 0.5s ease ${i*0.07}s`;
      s.style.opacity = '1'; s.style.transform = 'none'; s.style.filter = 'none';
    }, 50);
  });
  setTimeout(cb, spans.length*70+650);
}
function shimmer(spans, dur, cb) {
  let f = 0; const total = dur/(1000/60);
  (function tick() {
    f++;
    spans.forEach((s,i) => {
      const v = 0.7 + 0.3*Math.sin(f*0.08+i*0.5);
      s.style.textShadow = `0 0 ${20*v}px rgba(0,220,255,${v}), 0 0 ${60*v}px rgba(0,150,255,${v*0.5}), 0 0 ${100*v}px rgba(0,90,255,${v*0.25})`;
    });
    if (f < total) requestAnimationFrame(tick);
    else if (cb) cb();
  })();
}
function animateOut(spans, cb) {
  spans.forEach((s,i) => {
    const ang = (i/spans.length)*360, rad = ang*Math.PI/180;
    s.style.transition = `opacity 0.4s ease ${i*0.04}s, transform 0.5s ease ${i*0.04}s`;
    s.style.opacity = '0';
    s.style.transform = `translate(${Math.cos(rad)*300}px,${Math.sin(rad)*200}px) scale(0) rotate(${ang}deg)`;
  });
  setTimeout(cb, spans.length*40+550);
}
function popIn() {
  subWord.style.transition = 'transform 0.55s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s ease';
  subWord.style.opacity = '1'; subWord.style.transform = 'scale(1) translateY(0)';
}
function popOut(cb) {
  subWord.style.transition = 'transform 0.3s ease, opacity 0.25s ease';
  subWord.style.opacity = '0'; subWord.style.transform = 'scale(0) translateY(20px)';
  label.style.opacity = '0';
  presents.style.opacity = '0';
  setTimeout(cb, 350);
}

let spans = [];
function playEntrance() {
  spans = buildWord();
  animateIn(spans, () => shimmer(spans, 1400, popIn));
}
// Labels appear first
setTimeout(() => {
  label.style.opacity = '1';
  presents.style.opacity = '1';
}, 300);
// ADDITION animation starts after labels are fully visible
setTimeout(playEntrance, 1600);

subWord.addEventListener('click', () => {
  popOut(() => animateOut(spans, () => { window.location.href = 'page-master-basics.html'; }));
}, { once: true });
</script>
</body>
</html>
